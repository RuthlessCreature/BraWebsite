        <h2>Talk to <em>Nicole.</em></h2>
        <p>Share the styles you want, target market, estimated quantity and any questions about future products. We can prepare a clearer follow-up conversation from there.</p>
        <a class="mail-link" href="mailto:${contactEmail}">${contactEmail} ↗</a>
        <div class="contact-person">NICOLE · INTERNATIONAL CONTACT<br/>TEL / WHATSAPP <a href="tel:${contactPhoneHref}">${contactPhoneDisplay}</a><br/>DOMAIN TARGET: bra.pomerol.trade</div>
      </div>
      <form id="inquiryForm" class="inquiry">
        <h3>Send a wholesale inquiry</h3>
        <p>The form opens a pre-filled email draft in the visitor's own mail app.</p>
        <div class="form-row"><label>Your name *<input name="name" required maxlength="80" placeholder="Full name"></label><label>Company / brand<input name="company" maxlength="100" placeholder="Business name"></label></div>
        <div class="form-row"><label>Email address *<input name="email" required type="email" maxlength="120" placeholder="you@company.com"></label><label>Country / region<input name="country" maxlength="80" placeholder="Your market"></label></div>
        <div class="form-row"><label>Interested style<select name="style"><option value="All current styles">All current styles</option>${products.map(p=>`<option value="${p.id}# — ${esc(p.name)}">${p.id}# — ${esc(p.name)}</option>`).join('')}</select></label><label>Estimated quantity<input name="quantity" maxlength="80" placeholder="e.g. 500 sets"></label></div>
        <label>Message *<textarea name="message" required rows="4" maxlength="4000" placeholder="Tell us what you are looking for, preferred sizes, colours and timing."></textarea></label>
        <button type="submit" class="button submit-btn">Prepare inquiry email <span>↗</span></button>
        <small>No information is stored on this website.</small>
      </form>
    </div>
  </section>`;
}

function footer(){
  return `<footer><div class="container footer-inner"><div class="footer-logo">POMEROL<span>INTIMATES · MANUFACTURER</span></div><div class="footer-links"><a href="#collections">Collections</a><a href="#about">About</a><a href="#manufacturing">Manufacturing</a><a href="#contact">Contact</a><a href="mailto:${contactEmail}">Email ↗</a></div><p>© ${new Date().getFullYear()} Pomerol Trade. All rights reserved.</p></div></footer>`;
}

function modal(){
  if(!activeProduct) return '';
  const p = products.find(x => x.id === activeProduct);
  const current = p.images[activeImage] || p.images[0];
  return `
  <div class="modal-backdrop" id="modalBg">
    <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(p.name)}">
      <button class="modal-close" id="closeModal" aria-label="Close">✕</button>
      <div class="modal-gallery">
        <div class="modal-main">
          ${img(current,p.name,'modal-preview')}
          <button class="gallery-prev" id="prevImg" aria-label="Previous image">‹</button>
          <button class="gallery-next" id="nextImg" aria-label="Next image">›</button>
          <span class="gallery-index">${activeImage+1} / ${p.images.length}</span>
        </div>
        <div class="thumbnails">${p.images.map((name,i)=>`<button data-thumb="${i}" class="${i===activeImage?'active':''}" aria-label="View image ${i+1}">${img(name,`${p.name} thumbnail ${i+1}`)}</button>`).join('')}</div>
      </div>
      <div class="modal-details">
        <div class="kicker">${esc(p.eyebrow)}</div>
        <h2>${esc(p.name)}</h2>
        <p>${esc(p.description)}</p>
        <div class="spec"><b>Style no.</b><span>${esc(p.id)}#</span></div>
        <div class="spec"><b>Sizes</b><span>${esc(p.sizes.join(' · '))}</span></div>
        <div class="spec"><b>Colours</b><span>${esc(p.colors.join(' · '))}</span></div>
        <div class="spec"><b>Support</b><span>${esc(p.cup)}</span></div>
        <div class="spec"><b>Fabric notes</b><span>${esc(p.fabric)}</span></div>
        <div class="color-pills">${p.colors.map(c=>`<span>${esc(c)}</span>`).join('')}</div>
        <button class="button" data-inquire="${p.id}">Request inquiry email <span>↗</span></button>
        <p class="micro">For detailed quotations, updated stock conversations or future collection planning, please contact Nicole directly.</p>
      </div>
    </div>
  </div>`;
}

function render(){
  app.innerHTML = header()+hero()+about()+collections()+editorial()+manufacturing()+contactBlock()+footer()+modal();
  bind();
}

function buildMailTo(prefillStyle=''){
  const form = document.querySelector('#inquiryForm');
  const fd = form ? new FormData(form) : null;
  const name = fd ? fd.get('name') || '' : '';
  const company = fd ? fd.get('company') || '' : '';
  const email = fd ? fd.get('email') || '' : '';
  const country = fd ? fd.get('country') || '' : '';
  const style = prefillStyle || (fd ? fd.get('style') || 'All current styles' : 'All current styles');
  const quantity = fd ? fd.get('quantity') || '' : '';
  const message = fd ? fd.get('message') || '' : '';
  const subject = `Wholesale Inquiry - ${style}`;
  const body = [
    `Name: ${name}`,
    `Company / Brand: ${company}`,
    `Email: ${email}`,
    `Country / Region: ${country}`,
    `Interested Style: ${style}`,
    `Estimated Quantity: ${quantity}`,
    '',
    'Message:',
    `${message}`
  ].join('\n');
  return `mailto:${contactEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

function openProduct(id){ activeProduct = id; activeImage = 0; render(); }
function closeProduct(){ activeProduct = null; activeImage = 0; render(); }

function bind(){
  document.querySelector('#mobileMenu')?.addEventListener('click', () => { mobileMenu = !mobileMenu; render(); });
  document.querySelectorAll('[data-filter]').forEach(btn => btn.addEventListener('click', () => { activeCategory = btn.dataset.filter; render(); }));
  document.querySelector('#search')?.addEventListener('input', e => { search = e.target.value; render(); });
  document.querySelectorAll('[data-open]').forEach(btn => btn.addEventListener('click', () => openProduct(btn.dataset.open)));
  document.querySelector('#closeModal')?.addEventListener('click', closeProduct);
  document.querySelector('#modalBg')?.addEventListener('click', e => { if(e.target.id === 'modalBg') closeProduct(); });
  document.querySelector('#prevImg')?.addEventListener('click', () => {
    const p = products.find(x => x.id === activeProduct); activeImage = (activeImage - 1 + p.images.length) % p.images.length; render();
  });
  document.querySelector('#nextImg')?.addEventListener('click', () => {
    const p = products.find(x => x.id === activeProduct); activeImage = (activeImage + 1) % p.images.length; render();
  });
  document.querySelectorAll('[data-thumb]').forEach(btn => btn.addEventListener('click', () => { activeImage = Number(btn.dataset.thumb); render(); }));
  document.querySelectorAll('[data-inquire]').forEach(btn => btn.addEventListener('click', () => {
    const p = products.find(x => x.id === btn.dataset.inquire);
    window.location.href = buildMailTo(`${p.id}# — ${p.name}`);
  }));
  document.querySelector('#inquiryForm')?.addEventListener('submit', e => {
    e.preventDefault();
    window.location.href = buildMailTo();
  });
  document.querySelectorAll('a[href^="#"]').forEach(a => a.addEventListener('click', () => { if(window.innerWidth < 741){ mobileMenu = false; setTimeout(render, 50);} }));
  document.addEventListener('keydown', escHandler, { once: true });
}

function escHandler(e){
  if(e.key === 'Escape' && activeProduct) closeProduct();
}

render();

  </script>
</body>
</html>
